name: complitrack
description: CompliTrack Mobile - USTP Claveria CET Regulatory Compliance & Accountability System
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  lucide_icons: ^0.257.0
  file_picker: ^8.0.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  socket_io_client: ^2.0.3
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  go_router: ^14.0.0
  provider: ^6.1.0
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.3
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
