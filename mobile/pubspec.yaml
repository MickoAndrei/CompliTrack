name: complitrack
description: CompliTrack Mobile - USTP Claveria CET Regulatory Compliance & Accountability System
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  lucide_icons_flutter: ^4.0.0
  file_picker: ^13.1.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  socket_io_client: ^3.1.6
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  go_router: ^18.1.0
  provider: ^6.1.5+1
  fl_chart: ^1.2.0
  percent_indicator: ^4.2.5
  google_fonts: ^9.0.0
  intl: ^0.20.3
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
