name: Build Flutter APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Create .env file
        run: |
          echo "COMPLITRACK_API_URL=https://your-backend-api.com" > .env
          echo "COMPLITRACK_REALTIME_URL=https://your-backend-socket.com" >> .env
        working-directory: ./mobile

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./mobile

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
        working-directory: ./mobile

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
