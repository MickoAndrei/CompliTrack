services:
  mongodb:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try {
            if (rs.status().ok) quit(0);
          } catch (e) {
            const result = rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]});
            quit(result.ok ? 0 : 1);
          }
          quit(1);'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  mongodb_data:
